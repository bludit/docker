---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bludit
  namespace: bludit
  labels:
    app: bludit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bludit
  template:
    metadata:
      labels:
        app: bludit
    spec:
      containers:
        - name: bludit
          image: bludit/docker:3.22.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: bludit-content
              mountPath: /usr/share/nginx/html/bl-content
            - name: bludit-plugins
              mountPath: /usr/share/nginx/html/bl-plugins
            - name: bludit-themes
              mountPath: /usr/share/nginx/html/bl-themes
      volumes:
        - name: bludit-content
          persistentVolumeClaim:
            claimName: bludit-content
        - name: bludit-plugins
          persistentVolumeClaim:
            claimName: bludit-plugins
        - name: bludit-themes
          persistentVolumeClaim:
            claimName: bludit-themes
