---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: bludit
  name: bludit-content
  namespace: bludit
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 100M
